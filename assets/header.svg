<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="Dhirendra Kumar profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="45%" stop-color="#0c1630"/>
      <stop offset="100%" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="280" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1097" height="277" rx="22.5" fill="none" stroke="url(#glow)" stroke-opacity="0.35"/>

  <circle cx="980" cy="40" r="90" fill="#22d3ee" opacity="0.08" filter="url(#soft)"/>
  <circle cx="140" cy="250" r="80" fill="#a78bfa" opacity="0.10" filter="url(#soft)"/>

  <!-- contribution-style grid -->
  <g fill="#22d3ee" opacity="0.18">
    <rect x="70" y="48" width="10" height="10" rx="2"/>
    <rect x="86" y="48" width="10" height="10" rx="2" opacity="0.45"/>
    <rect x="102" y="48" width="10" height="10" rx="2"/>
    <rect x="118" y="48" width="10" height="10" rx="2" opacity="0.3"/>
    <rect x="70" y="64" width="10" height="10" rx="2" opacity="0.35"/>
    <rect x="86" y="64" width="10" height="10" rx="2"/>
    <rect x="102" y="64" width="10" height="10" rx="2" opacity="0.55"/>
    <rect x="118" y="64" width="10" height="10" rx="2"/>
    <rect x="70" y="80" width="10" height="10" rx="2"/>
    <rect x="86" y="80" width="10" height="10" rx="2" opacity="0.25"/>
    <rect x="102" y="80" width="10" height="10" rx="2"/>
    <rect x="118" y="80" width="10" height="10" rx="2" opacity="0.5"/>
  </g>

  <!-- tiny snake -->
  <g transform="translate(70 108)">
    <rect x="0" y="16" width="10" height="10" rx="2" fill="#67e8f9"/>
    <rect x="16" y="16" width="10" height="10" rx="2" fill="#22d3ee"/>
    <rect x="32" y="16" width="10" height="10" rx="2" fill="#22d3ee"/>
    <rect x="32" y="0" width="10" height="10" rx="2" fill="#818cf8"/>
    <rect x="48" y="0" width="10" height="10" rx="2" fill="#a78bfa"/>
    <circle cx="53" cy="3" r="1.4" fill="#0b1220"/>
  </g>

  <text x="70" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#67e8f9">~/dhirendra</text>
  <text x="70" y="214" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#title)">Dhirendra Kumar</text>
  <text x="70" y="248" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Software engineer  ·  frontend  ·  Python  ·  AI evaluation</text>
</svg>
